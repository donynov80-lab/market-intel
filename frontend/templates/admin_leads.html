<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Leads</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            padding: 20px;
            color: #333;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { margin-bottom: 8px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
        .nav { margin-bottom: 20px; }
        .nav a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            margin-right: 16px;
        }
        .nav a:hover { text-decoration: underline; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .stat-box {
            background: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .stat-box .angka {
            font-size: 28px;
            font-weight: 700;
            color: #667eea;
        }
        .stat-box .label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f8f9fa;
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            font-weight: 600;
        }
        tr:hover { background: #f8f9fa; }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-baru { background: #d1ecf1; color: #0c5460; }
        .badge-followup { background: #fff3cd; color: #856404; }
        .badge-closing { background: #d4edda; color: #155724; }
        .badge-batal { background: #f8d7da; color: #721c24; }

        .btn-wa {
            display: inline-block;
            padding: 6px 12px;
            background: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        .btn-wa:hover { background: #1da851; }

        .btn-mini {
            padding: 4px 8px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 4px;
        }
        .btn-status {
            background: #e7e7e7;
            color: #333;
        }
        .btn-status:hover { background: #d0d0d0; }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .info-kampanye {
            font-size: 12px;
            color: #667eea;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/">🏠 Halaman Promo</a>
            <a href="/admin">📢 Kelola Campaign</a>
            <a href="/admin/leads"><strong>📋 Leads</strong></a>
        </div>

        <h1>📋 Daftar Leads</h1>
        <p class="subtitle">Orang-orang yang tertarik dengan promo kamu</p>

        <div class="stats" id="stats"></div>

        <div class="card">
            <div id="listLeads">
                <div class="empty-state">Memuat data...</div>
            </div>
        </div>
    </div>

    <script>
        async function loadLeads() {
            try {
                const r = await fetch('/api/admin/leads');
                const data = await r.json();
                renderStats(data.statistik);
                renderLeads(data.leads);
            } catch (e) {
                document.getElementById('listLeads').innerHTML =
                    `<div class="empty-state">❌ Gagal memuat: ${e.message}</div>`;
            }
        }

        function renderStats(stat) {
            const el = document.getElementById('stats');
            const perStatus = stat.per_status || {};

            el.innerHTML = `
                <div class="stat-box">
                    <div class="angka">${stat.total}</div>
                    <div class="label">Total Leads</div>
                </div>
                <div class="stat-box">
                    <div class="angka">${perStatus.baru || 0}</div>
                    <div class="label">Baru</div>
                </div>
                <div class="stat-box">
                    <div class="angka">${perStatus.followup || 0}</div>
                    <div class="label">Follow-up</div>
                </div>
                <div class="stat-box">
                    <div class="angka">${perStatus.closing || 0}</div>
                    <div class="label">Closing</div>
                </div>
            `;
        }

        function renderLeads(leads) {
            const el = document.getElementById('listLeads');

            if (!leads || leads.length === 0) {
                el.innerHTML = `
                    <div class="empty-state">
                        📭 Belum ada leads.<br>
                        Sebar promo kamu untuk mulai mengumpulkan kontak!
                    </div>
                `;
                return;
            }

            el.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nama</th>
                            <th>No WhatsApp</th>
                            <th>Campaign</th>
                            <th>Tanggal</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${leads.map((l, i) => `
                            <tr>
                                <td>${i + 1}</td>
                                <td><strong>${l.nama}</strong></td>
                                <td>
                                    <a class="btn-wa" href="https://wa.me/${l.no_wa}?text=Halo%20${encodeURIComponent(l.nama)},%20terima%20kasih%20sudah%20tertarik%20dengan%20promo%20kami!" target="_blank">
                                        💬 ${l.no_wa}
                                    </a>
                                </td>
                                <td class="info-kampanye">
                                    ${l.campaign_id ? '#' + l.campaign_id : '-'}
                                </td>
                                <td style="font-size:12px; color:#888;">
                                    ${l.dibuat ? l.dibuat.substring(0, 16).replace('T', ' ') : '-'}
                                </td>
                                <td>
                                    <span class="badge badge-${l.status}">
                                        ${l.status}
                                    </span>
                                </td>
                                <td>
                                    <button class="btn-mini btn-status" onclick="ubahStatus(${l.id}, 'followup')">Follow-up</button>
                                    <button class="btn-mini btn-status" onclick="ubahStatus(${l.id}, 'closing')">Closing</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        async function ubahStatus(id, status) {
            try {
                await fetch(`/api/admin/leads/${id}/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: status })
                });
                loadLeads();
            } catch (e) {
                alert('❌ Gagal: ' + e.message);
            }
        }

        loadLeads();
    </script>
</body>
</html>
